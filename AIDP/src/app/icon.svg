<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AIDP">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#06334e"/>
      <stop offset="1" stop-color="#01131d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9ec6de"/><stop offset="1" stop-color="#5f93b4"/>
    </linearGradient>
    <linearGradient id="broken" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e8f8ff"/><stop offset="1" stop-color="#93d9ff"/>
    </linearGradient>
  </defs>
  <!-- The tab icon keeps the master's ground: the pale courses need a dark
       plate to survive a light browser chrome. -->
  <rect width="512" height="512" rx="114" fill="url(#p)"/>
  <!-- The mark is drawn in the component's 120 box, then scaled about its own
       centre onto the 512 plate — 3.05 leaves roughly a 14% margin, which is
       what stops the longest course touching the plate's rounded corner. -->
  <g transform="translate(256 256) scale(3.05) translate(-60 -57)">
    <g transform="translate(60 57) skewX(-12) translate(-60 -57)">
      <rect x="14" y="8" width="72" height="20" rx="6" fill="url(#wall)"/>
      <rect x="14" y="34" width="92" height="20" rx="6" fill="url(#wall)"/>
      <rect x="14" y="60" width="32" height="20" rx="6" fill="url(#broken)"/>
      <rect x="66" y="60" width="40" height="20" rx="6" fill="url(#broken)"/>
      <rect x="14" y="86" width="56" height="20" rx="6" fill="url(#wall)"/>
    </g>
  </g>
</svg>
